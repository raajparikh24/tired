<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tireddd? This might help 👀</title>
<style>
:root{
  --purple:#7651a8; --deep:#4d356d; --lav:#eee3ff; --pink:#fff0f6;
  --cream:#fffaf5; --text:#392d42;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden}
body{
  min-height:100svh; font-family:ui-rounded,"SF Pro Rounded",Inter,system-ui,-apple-system,sans-serif;
  color:var(--text); background:
  radial-gradient(circle at 15% 15%,#f3e7ff 0 14%,transparent 35%),
  radial-gradient(circle at 90% 85%,#ffe5f1 0 12%,transparent 32%),
  linear-gradient(145deg,#fffafd,#f8f0ff);
  display:grid;place-items:center;padding:20px;
}
.card{
  width:min(430px,100%);height:min(700px,88svh);min-height:570px;
  border:1px solid rgba(118,81,168,.13);border-radius:32px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(16px);
  box-shadow:0 24px 70px rgba(89,58,115,.15);position:relative;overflow:hidden;
}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 22px 28px;transition:.5s ease}
h1{font-size:clamp(25px,7vw,34px);line-height:1.12;margin:16px 0 8px;letter-spacing:-.7px}
.sub{font-size:15px;opacity:.65;margin:0}
.start{justify-content:center}
.btn{
  margin-top:28px;border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:750;
  background:var(--deep);color:#fff;box-shadow:0 10px 24px rgba(77,53,109,.22);cursor:pointer;
  transition:transform .18s ease;
}
.btn:active{transform:scale(.96)}
.hidden{opacity:0;pointer-events:none;transform:translateY(12px)}
.bouquetScene{justify-content:center}
.bouquet{
  position:relative;width:270px;height:320px;cursor:pointer;transform:translateY(30px) scale(.3) rotate(-7deg);
  opacity:0;transition:1s cubic-bezier(.16,.9,.22,1.2);
}
.bouquet.in{opacity:1;transform:translateY(0) scale(1) rotate(-2deg)}
.flower{position:absolute;font-size:72px;filter:drop-shadow(0 7px 5px rgba(60,30,90,.08))}
.f1{left:18px;top:28px;transform:rotate(-18deg)} .f2{left:92px;top:0;font-size:84px}
.f3{right:12px;top:36px;transform:rotate(15deg)} .f4{left:60px;top:73px;font-size:78px}
.f5{right:58px;top:86px;font-size:74px}
.stem{position:absolute;width:8px;height:170px;background:#79a86b;border-radius:10px;transform-origin:top}
.s1{left:85px;top:116px;transform:rotate(-12deg)} .s2{left:132px;top:113px}
.s3{left:180px;top:116px;transform:rotate(13deg)}
.wrap{
 position:absolute;left:67px;top:168px;width:145px;height:126px;background:#f4d7eb;
 clip-path:polygon(0 0,100% 0,76% 100%,30% 100%);border-radius:8px;box-shadow:0 10px 20px #b78ca52b
}
.bow{position:absolute;left:106px;top:202px;font-size:54px;z-index:3}
.tap{margin-top:8px;font-size:13px;opacity:.48}
.petal{position:absolute;pointer-events:none;font-size:25px;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),420px) rotate(320deg);opacity:0}}
.pastryScene{justify-content:center}
.wait{font-size:22px;font-weight:800;margin-bottom:25px}
.pastry{
 font-size:115px;filter:drop-shadow(0 15px 10px rgba(75,40,50,.12));cursor:pointer;
 animation:runaway 2.4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes runaway{
 0%{transform:translateX(-520px) rotate(-30deg)}
 48%{transform:translateX(520px) rotate(35deg)}
 65%{transform:translateX(520px) rotate(35deg)}
 100%{transform:translateX(0) rotate(-3deg)}
}
.final{justify-content:center}
.final-items{display:flex;align-items:center;gap:18px;font-size:88px;margin-bottom:20px;animation:pop .65s cubic-bezier(.2,.9,.25,1.25)}
.final h1{font-size:31px}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.spark{position:absolute;pointer-events:none;font-size:20px;animation:spark .85s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.3) rotate(120deg);opacity:0}}
.tiny{position:absolute;bottom:17px;font-size:11px;opacity:.28}
</style>
</head>
<body>
<main class="card" id="card">
  <section class="scene start" id="start">
    <div style="font-size:58px">🥱</div>
    <h1>Heard someone’s a little tireddd 👀</h1>
    <button class="btn" id="openBtn">this might help →</button>
  </section>

  <section class="scene bouquetScene hidden" id="flowers">
    <div class="bouquet" id="bouquet" aria-label="purple flowers">
      <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div>
      <div class="wrap"></div>
      <span class="flower f1">🌷</span><span class="flower f2">🪻</span>
      <span class="flower f3">🌷</span><span class="flower f4">🪻</span><span class="flower f5">🌸</span>
      <span class="bow">🎀</span>
    </div>
    <div class="tap">tap the flowers :)</div>
  </section>

  <section class="scene pastryScene hidden" id="pastryScene">
    <div class="wait">waittt… one more thing</div>
    <div class="pastry" id="pastry">🍰</div>
    <div class="tap">catch it 😂</div>
  </section>

  <section class="scene final hidden" id="final">
    <div class="final-items"><span>🪻</span><span>🍰</span></div>
    <h1>Hope this made you smile :)</h1>
    <div class="tiny">now please give those feet a break 😂</div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
function show(id){
  document.querySelectorAll('.scene').forEach(x=>x.classList.add('hidden'));
  $(id).classList.remove('hidden');
}
$('#openBtn').onclick=()=>{
  show('#flowers');
  setTimeout(()=>$('#bouquet').classList.add('in'),80);
};
$('#bouquet').onclick=()=>{
  const card=$('#card'), b=$('#bouquet').getBoundingClientRect(), c=card.getBoundingClientRect();
  for(let i=0;i<20;i++){
    const p=document.createElement('span'); p.className='petal';
    p.textContent=['🪻','🌸','✦'][Math.floor(Math.random()*3)];
    p.style.left=(b.left-c.left+60+Math.random()*150)+'px';
    p.style.top=(b.top-c.top+20+Math.random()*100)+'px';
    p.style.setProperty('--x',(Math.random()*220-110)+'px');
    p.style.animationDelay=(Math.random()*.25)+'s'; card.appendChild(p);
    setTimeout(()=>p.remove(),2200);
  }
  setTimeout(()=>show('#pastryScene'),850);
};
$('#pastry').onclick=e=>{
  const card=$('#card'), r=e.target.getBoundingClientRect(), c=card.getBoundingClientRect();
  for(let i=0;i<16;i++){
    const s=document.createElement('span');s.className='spark';s.textContent=['✨','🌸','✦'][i%3];
    s.style.left=(r.left-c.left+r.width/2)+'px';s.style.top=(r.top-c.top+r.height/2)+'px';
    const a=Math.random()*Math.PI*2,d=50+Math.random()*100;
    s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');
    card.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
  setTimeout(()=>show('#final'),500);
};
</script>
</body>
</html>
